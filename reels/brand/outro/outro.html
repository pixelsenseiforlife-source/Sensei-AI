<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Outro Pixel Sensei</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; width:1080px; height:1920px; overflow:hidden; background:#1B1B1B }
  .stage{ position:absolute; inset:0; animation:shake .25s linear .72s both, push 2.6s ease-out .9s both }
  .sun{ position:absolute; left:90px; top:330px; width:900px; height:900px; border-radius:50%; background:#E63B2E;
        animation:sunIn .55s cubic-bezier(.2,.9,.3,1.15) 0s both }
  .ring{ position:absolute; left:90px; top:330px; width:900px; height:900px; border-radius:50%; box-sizing:border-box;
         border:14px solid #F4EDE1; opacity:0; animation:ring .7s ease-out .72s forwards }
  .ring.r2{ border-color:#F2B33D; border-width:8px; animation:ring .9s ease-out .8s forwards }
  .logo{ position:absolute; left:150px; top:390px; width:780px; height:780px; background:url(../logo-pixel-sensei-creme.png) center/contain no-repeat;
         animation:stamp .5s cubic-bezier(.5,0,.75,0) .3s both, settle .25s ease-out .8s both }
  .t1{ position:absolute; top:1300px; width:100%; text-align:center; font-family:Anton,sans-serif; font-size:118px; letter-spacing:6px; color:#F2B33D;
       animation:up .5s cubic-bezier(.2,.8,.2,1) 1.1s both }
  .brush{ position:absolute; top:1478px; left:390px; width:300px; height:16px; background:#E63B2E; border-radius:6px 20px 8px 16px; transform-origin:left;
          animation:brush .4s ease-out 1.35s both }
  .t2{ position:absolute; top:1520px; width:100%; text-align:center; font-family:Inter,sans-serif; font-weight:800; font-size:56px; letter-spacing:2px; color:#F4EDE1;
       animation:up .5s cubic-bezier(.2,.8,.2,1) 1.45s both }
  @keyframes sunIn{ from{ transform:scale(0) } to{ transform:scale(1) } }
  @keyframes stamp{ from{ transform:scale(2.2) rotate(-14deg); opacity:0 } 60%{ opacity:1 } to{ transform:scale(.94) rotate(0); opacity:1 } }
  @keyframes settle{ from{ transform:scale(.94) } 60%{ transform:scale(1.025) } to{ transform:scale(1) } }
  @keyframes ring{ from{ transform:scale(.86); opacity:.9 } to{ transform:scale(1.45); opacity:0 } }
  @keyframes shake{ 0%{transform:translate(0,0)} 20%{transform:translate(-12px,8px)} 40%{transform:translate(10px,-6px)} 60%{transform:translate(-6px,4px)} 80%{transform:translate(3px,-2px)} 100%{transform:translate(0,0)} }
  @keyframes push{ from{ scale:1 } to{ scale:1.035 } }
  @keyframes up{ from{ transform:translateY(60px); opacity:0 } to{ transform:none; opacity:1 } }
  @keyframes brush{ from{ transform:scaleX(0) skewX(-12deg) } to{ transform:scaleX(1) skewX(-12deg) } }
</style></head>
<body><div class="stage">
  <div class="sun"></div><div class="ring"></div><div class="ring r2"></div><div class="logo"></div>
  <div class="t1">LA VOIE DU PIXEL</div><div class="brush"></div><div class="t2">@iampixelsensei</div>
</div></body></html>
